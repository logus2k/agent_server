; llama-router-models.base.ini
;
; STATIC base for the llama-server router preset. Holds the parts that do
; NOT change when you switch the resident chat model: the global [*]
; defaults and the bge embedder models (owned by noted-rag).
;
; The ACTIVE chat model section is spliced in at the @@ACTIVE_CHAT_MODEL@@
; marker below by bin/apply_active_model.py, which reads the active entry
; from data/agent_config.json. The generated output is llama-router-models.ini
; — do NOT hand-edit that file; edit this base (for embedders/globals) or
; agent_config.json (for the chat model) and regenerate.
;
; Per-model llama-server lore (MTP, KV cache, ctx-checkpoints, etc.) lives
; in documents/llama_server_model_notes.md.

version = 1

[*]
n-gpu-layers = -1
flash-attn = on
; Cross-slot prefix-cache reuse: when a new request's prompt shares a
; >=256-token prefix with ANY currently-cached slot's prompt, reuse that
; prefix instead of re-prefilling. 256 is the upstream-recommended floor.
cache-reuse = 256

[gemma-4-e2b]
; Reasoning model. Vision via mmproj + official Gemma 4 Jinja template.
; ctx-checkpoints=0 avoids the long-SWA restore crash.
; swa-full=true (full SWA cache) is the documented wedge fix; c lowered to 65536
; to fit the larger cache. Clean single-user re-test 2026-06-24.
; See documents/llama_server_model_notes.md for MTP/ngram/KV history.
model = /agent_server_models/gemma4_e2b/gemma-4-E2B-it-UD-Q4_K_XL.gguf
mmproj = /agent_server_models/gemma4_e2b/mmproj-F16.gguf
c = 65536
swa-full = true
ctx-checkpoints = 0
jinja = true
reasoning = on
; Multi-Token Prediction (MTP) speculative decoding via the matched E2B draft
; head (mtp-gemma-4-E2B-it.gguf, alongside the base model). flash-attn MUST be
; off with draft-mtp (overrides the global flash-attn=on). Mirrors the active
; gemma-4-e2b entry in data/agent_config.json.
flash-attn = off
spec-type = draft-mtp
spec-draft-model = /agent_server_models/gemma4_e2b/mtp-gemma-4-E2B-it.gguf
spec-draft-n-max = 4
n-gpu-layers-draft = -1
load-on-startup = true

[bge-m3]
model = /noted_models/bge-m3-q8/bge-m3-Q8_0.gguf
embedding = true
pooling = cls
c = 8192
; Pooling-mode embedders need the WHOLE sequence in one physical batch
; (no chunked prefill). noted-rag's chunker targets 700-1000 tokens, so
; match physical batch to context to fit any single sequence.
batch-size = 8192
ubatch-size = 8192
load-on-startup = true

[bge-reranker]
model = /noted_models/bge-reranker-v2-m3-q8/bge-reranker-v2-m3-Q8_0.gguf
embedding = true
pooling = rank
c = 8192
; Same reason as bge-m3: query + </s></s> + chunk pairs routinely exceed
; 512 tokens; pooling forbids chunked prefill.
batch-size = 8192
ubatch-size = 8192
load-on-startup = true
