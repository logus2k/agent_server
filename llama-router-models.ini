; Production llama-server router preset.
;
; Hosts gemma-4 (chat + vision), bge-m3 (embeddings), bge-reranker (reranking)
; in a single llama-server process. Each loaded on startup so the first
; request to each model has no cold-start cost.
;
; agent_server's LlamaServerEngine specifies `model: "gemma-4"` in chat
; requests. noted-rag (when its forwarding refactor lands) will hit
; bge-m3 and bge-reranker via the same endpoint with their respective
; model names.
;
; Validated empirically 2026-05-02 in _router_test/ — all 3 mixed model
; types coexist; per-model flags applied via INI overrides.

version = 1

[*]
n-gpu-layers = -1
flash-attn = on
; Cross-slot prefix-cache reuse: when a new request's prompt shares a
; >=256-token prefix with ANY currently-cached slot's prompt, reuse that
; prefix instead of re-prefilling. Within-slot caching (the same chat
; reusing its own slot's KV) is already on by default. This adds the
; cross-slot dimension — useful when multiple concurrent requests share
; the same big system prompt (multi-user, parallel agent presets, etc).
; Cost is a tiny prefix-match loop; benefit is skipped prefill on cache
; hits. 256 is the upstream-recommended floor; below that the matching
; loop overhead approaches the prefill it would skip.
cache-reuse = 256

[gemma-4]
model = /agent_server_models/gemma-4-E4B-it-UD-Q4_K_XL.gguf
mmproj = /agent_server_models/mmproj-F16.gguf
; Multi-Token Prediction (MTP) via the AtomicBot-ai turboquant fork
; was tested live 2026-05-10. Measured 170 tok/s with ~50% draft
; accept rate on Gemma 4 E4B Q4_K_XL — within the fork README's
; +30-50% band. NOT enabled in production because the fork
; auto-disables MTP when mmproj is loaded (silent log line
; "speculative decoding is not supported by multimodal") and we
; need vision. To re-enable on the fork image, comment `mmproj`
; above, override `flash-attn = off` (the fork's MTP CUDA decode
; crashes in fattn.cu:109 when fa is on), uncomment the four lines
; below, and switch the image in docker-compose.yml. The Q4_K_M
; assistant GGUF lives at data/models/gemma-4-E4B-it-assistant.Q4_K_M.gguf.
; See https://ai.google.dev/gemma/docs/mtp/mtp and
; AtomicChat/gemma-4-E4B-it-assistant-GGUF.
; spec-type = mtp
; mtp-head = /agent_server_models/gemma-4-E4B-it-assistant.Q4_K_M.gguf
; draft-block-size = 3
; n-gpu-layers-draft = -1
c = 131072
; No `parallel` setting → llama-server defaults to auto (4 slots),
; which also default-enables --kv-unified. This is the right default:
; experiments 2026-05-04 showed `parallel = 2 + kv-unified = on`
; saved only ~200 MB vs auto, not worth giving up 2 concurrent slots
; (needed for primary-stream + voice-injection secondary call +
; future multi-agent / multi-user). KV pool is bounded by `c` either
; way, slot count only changes per-slot compute buffer scratch.
; See project_llama_vision_vram_tuning.md.
; Use the OFFICIAL gemma4 chat template (vendored in data/models/)
; instead of the GGUF-embedded one. The GGUF embeds the older asf0
; community template, which llama.cpp now flags as "outdated gemma4
; chat template" and runs compatibility workarounds against. The
; official template carries the `{#- OpenAI Chat Completions: -#}`
; marker llama.cpp checks for, so it takes the native gemma4 path
; (no workaround), AND it correctly replays reasoning_content into
; multi-turn tool-call history (the community template dropped it,
; which breaks reasoning between function calls in agent loops).
; Source: https://huggingface.co/google/gemma-4-E4B-it chat_template.jinja
; (the canonical template for this exact model).
jinja = true
chat-template-file = /agent_server_models/chat_template_gemma-4.jinja
; Activate thinking via the official, non-deprecated flag.
; --reasoning on injects <|think|> through the Jinja template AND tells
; the reasoning extractor to populate delta.reasoning_content.
; --reasoning auto (the default) only does so if the template self-
; declares thinking, which Gemma 4's template does not without an
; explicit enable_thinking flag — so 'on' is required for thinking.
; The earlier `chat-template-kwargs '{"enable_thinking":true}'` setup
; works but llama-server prints a deprecation warning recommending
; --reasoning on/off as the supported path.
reasoning = on
; KV cache quantization. Lowering KV memory while keeping c=131072.
; F16 KV: ~16 GB; q8_0 on K only: ~12 GB; q8_0 on both K and V: ~8 GB.
;
; HISTORY:
;   2026-05-15 first: set BOTH K and V to q8_0. Worker still died mid-run
;     (not OOM — VRAM had headroom). flash-attn + V-cache quantization is
;     known-flaky in llama.cpp, especially with mmproj loaded (Gemma 4's
;     vision projection). Worker's stderr is eaten by the router so no
;     visible crash log.
;   2026-05-15 second: K-only quantization. Most-tested combo across
;     llama.cpp builds. ~4 GB saved vs raw F16, still enough headroom
;     for spawn alongside the embedders + agent_server's Gemma.
;
; If we hit OOM again under load, the next lever is NOT touching V —
; either drop c to 65536 (still long-context, halves KV), or move to
; a smaller GGUF quant (Q4_K_M instead of UD-Q4_K_XL saves ~700 MB
; weights). Do NOT re-enable cache-type-v without a fresh test —
; mmproj + FA + V-quant has bitten us before.
;
; UPDATE 2026-05-15 evening: K-quant ALSO breaks the chat path under
; realistic load (16k+ char system prompt + 62 tool definitions +
; streaming). Symptoms: prefill takes long enough that the upstream
; SSE read times out, agent_server cancels the connection, llama-vision
; returns 500 with "Connection handling canceled", the browser sees an
; empty assistant bubble. Validated via tests/chat_smoke_probe.py:
;   with cache-type-k = q8_0:  assistant message never appears in DOM
;   without:                   appears at t+4.3s, finishes at t+6.3s
; The OOM I first diagnosed was a misread — that earlier crash came
; from accidentally bringing up the SMOKE-TEST single-model compose
; instead of the router (see feedback_llama_vision_two_compose_files.md).
; With the proper router compose, F16 KV at c=131072 fits in ~21 GB
; with ~3 GB margin. No quantization needed.
;
; Leaving this line commented as a tombstone so future-me doesn't
; re-add it. If a real OOM ever returns, drop c to 65536 (still long-
; context) before touching cache-type.
;cache-type-k = q8_0
load-on-startup = true

[bge-m3]
model = /noted_models/bge-m3-q8/bge-m3-Q8_0.gguf
embedding = true
pooling = cls
c = 8192
; Pooling-mode embedders need the WHOLE sequence in one physical batch
; (no chunked prefill possible). Default ubatch-size of 512 fails for any
; chunk > 512 tokens, and noted-rag's chunker targets 700-1000 tokens.
; Match physical batch to context so any single sequence fits.
batch-size = 8192
ubatch-size = 8192
load-on-startup = true

[bge-reranker]
model = /noted_models/bge-reranker-v2-m3-q8/bge-reranker-v2-m3-Q8_0.gguf
embedding = true
pooling = rank
c = 8192
; Same reason as bge-m3: query + </s></s> + chunk pairs routinely
; exceed 512 tokens; pooling forbids chunked prefill.
batch-size = 8192
ubatch-size = 8192
load-on-startup = true
