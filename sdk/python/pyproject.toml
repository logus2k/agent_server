[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent_server_sdk"
version = "0.1.0"
description = "Server-side Python SDK for agent_server (OpenAI-compatible chat, channel parsing, thinking toggle, model discovery + switching)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "agent_server" }]
dependencies = [
    "httpx>=0.24",
]

[project.optional-dependencies]
interactive = ["python-socketio[asyncio_client]>=5.8"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_server_sdk*"]
