; SMOKE-TEST preset for the AtomicBot-ai turboquant fork.
;
; Goal: prove that gemma-4 + the gemma4_assistant head load under
; --spec-type mtp + --mtp-head and that one chat/completions call
; returns tokens AND speculative-decoding telemetry shows accept
; events (NDJSON trace via LLAMA_MTP_ACC_TRACE).
;
; Flag choice:
;   - `mtp-head` (NOT `model-draft`) is the canonical fork recipe.
;     `--mtp-head` loads the assistant INTO the target (head-attached
;     MTP path); `--model-draft` would load it as a separate draft
;     model. Both are accepted by the fork but mtp-head is what every
;     example in the README uses.
;
; Constraints during this test:
;   - Live llama-vision (production) is using ~22.7 GB of 24.5 GB VRAM.
;   - We can't afford to load mmproj + bge-m3 + bge-reranker here too.
;   - So this preset hosts ONE model with a small context for headroom.
;     mmproj / vision and the bge embedders are already upstream features
;     the fork inherits; we're not re-validating those here.
;
; Once the smoke passes, the production llama-router-models.ini
; gets the same `mtp-head` + `spec-type = mtp` lines added under
; [gemma-4], at full c = 131072 with mmproj re-enabled.

version = 1

[*]
n-gpu-layers = -1
flash-attn = on

[gemma-4]
model = /agent_server_models/gemma-4-E4B-it-UD-Q4_K_XL.gguf
; HF card flags Q4_K_M (75 MB) as the recommended default; F16 (166 MB)
; is the reference. Q4_K_M is what we use here.
mtp-head = /agent_server_models/gemma-4-E4B-it-assistant.Q4_K_M.gguf
spec-type = mtp
; README recipe always shows draft-block-size = 3 (also the default);
; setting explicitly so the smoke matches the documented config.
draft-block-size = 3
; Draft layers do NOT auto-inherit from the global -ngl. README always
; pairs `-ngl 99 -ngld 99`, so set the draft offload explicitly.
n-gpu-layers-draft = -1
; Override the [*] flash-attn = on. fork's MTP decode path hits a
; fatal in /app/ggml/src/ggml-cuda/fattn.cu:109 when fa is on.
; Verifying this is the cause; will revisit later.
flash-attn = off
c = 8192
jinja = true
chat-template-file = /agent_server_models/chat_template_gemma-4.jinja
reasoning = on
load-on-startup = true
